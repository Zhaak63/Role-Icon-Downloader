<style>
:root{--bg:#1e1f22;--panel:#2b2d31;--line:#3f4147;--text:#f2f3f5;--mute:#b5bac1;--accent:#5865f2;--ok:#3ba55d;--err:#ed4245}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px 16px}
main{max-width:760px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:26px;margin:0 0 4px}
p.sub{color:var(--mute);margin:0 0 20px}
.panel{background:var(--panel);border-radius:10px;padding:18px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1}
button,select,input,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
button{cursor:pointer;background:var(--accent);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent;border-color:var(--line)}
button.on{background:var(--accent);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}
label{display:block;margin:0 0 6px;color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;margin-bottom:12px}
.row>input,.row>select{flex:1;min-width:0}
textarea{width:100%;min-height:130px;font-family:Consolas,monospace;font-size:13px;margin-bottom:12px}
.hint{color:var(--mute);font-size:13px;margin:0 0 12px}
.hint a,details a{color:#8ea1ff}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13px}
#status{min-height:22px;font-size:14px;margin-bottom:12px}
#status.err{color:var(--err)}#status.ok{color:var(--ok)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .count{margin-left:auto;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.role{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border:2px solid var(--line);border-radius:8px;cursor:pointer;text-align:center;position:relative}
.role.sel{border-color:var(--accent);background:rgba(88,101,242,.12)}
.role img{width:64px;height:64px;object-fit:contain;border-radius:6px}
.role span{font-size:13px;word-break:break-word}
.role input{position:absolute;top:8px;left:8px;width:16px;height:16px;padding:0}
.hidden{display:none}
.bar label{margin:0}
.prog{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-bottom:14px}
#fill{height:100%;width:0;background:var(--accent);transition:width .15s}
.search{width:100%;margin-bottom:14px}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;max-height:300px;overflow-y:auto;margin-bottom:12px}
.g{display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg);border:2px solid var(--line);padding:6px 10px;font-weight:500}
.g.sel{border-color:var(--accent);background:rgba(88,101,242,.12)}
.g img,.g .ph{width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover}
.g .ph{display:flex;align-items:center;justify-content:center;background:var(--panel);font-size:12px;font-weight:700}
.g .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.acts{display:flex;gap:6px}
.acts button{padding:2px 8px;font-size:13px}
details{margin-top:6px}
summary{cursor:pointer;font-weight:600;margin-bottom:8px}
details ol{padding-left:20px;margin:8px 0}
details li{margin-bottom:8px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;margin:8px 0;white-space:pre-wrap;word-break:break-all;font-size:12px}
pre code{background:none;padding:0}
footer{text-align:center;margin-top:28px;font-size:14px;color:var(--mute)}
footer a{color:var(--mute);text-decoration:none;font-weight:600}
footer a:hover{color:var(--text);text-decoration:underline}
</style>
</head>
<body>
<main>
  <header>

      <h1>Role Icon Downloader</h1>

        <button id="loadGuilds" type="button" data-i="loadGuilds"></button>

          <li data-i="h2"></li>
          <li data-i="h3"></li>
          <li><span data-i="h4"></span>
            <pre><code id="snippet">{webpackChunkdiscord_app.push([[Math.random()],{},e=&gt;{e.b&amp;&amp;(m=Object.values(e.c))}]);let e=m.find((e=&gt;!e?.exports?.messagesLoader&amp;&amp;e?.exports?.default?.getToken))?.exports?.default?.getToken?.();e?console.log(`"${e}"`):console.warn("Token not found.")}</code></pre>

          </li>

    <div id="modeManual" class="hidden">

      <label for="size" data-i="size"></label>
      <select id="size"><option>64</option><option>128</option><option>256</option><option selected>512</option><option>1024</option></select>
      <label for="naming" data-i="naming"></label>
      <select id="naming"><option value="name" data-i="namName"></option><option value="id" data-i="namId"></option><option value="both" data-i="namBoth"></option></select>
      <button id="dl" type="button" data-i="dl"></button>
      <span class="count" id="count"></span>
    </div>
    <div id="prog" class="prog hidden"><div id="fill"></div></div>
    <input id="search" class="search" type="search" data-p="searchPh">
    <div class="grid" id="grid"></div>
    <p class="hint" id="emojiNote" style="margin-top:14px"></p>
  </div>

  <footer>
    <a href="https://discord.gg/GRpCYzmtuJ" target="_blank" rel="noopener noreferrer">by Zhaak</a>
    · <a href="https://github.com/Zhaak63/Role-Icon-Downloader" target="_blank" rel="noopener noreferrer" data-i="source"></a>
    · <a href="https://discord.gg/94seN7srjv" target="_blank" rel="noopener noreferrer" data-i="support"></a>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  needToken: "Colle d'abord ton token.", loadingGuilds: "Chargement des serveurs…", noGuilds: "Aucun serveur trouvé pour ce token.",
  guildsFound: "{n} serveur(s) trouvé(s).", loadingRoles: "Chargement…", badJson: "JSON invalide : colle la réponse complète de l'API.",
  noRolesField: "Aucun champ « roles » dans ces données.", noEmojiField: "Aucun champ « emojis » dans ces données.",
  foundRoles: "{n} icône(s) trouvée(s) sur « {g} ».", foundEmojis: "{n} emoji(s) trouvé(s) sur « {g} ».",

en: {
  title: "Discord Role Icon Downloader",
  sub: "Download the role icons, emojis or stickers of a Discord server as a ZIP.",
  what: "What do you want to download?", optRoles: "Role icons", optEmojis: "Server emojis", optStickers: "Server stickers",
  tabToken: "With a token", tabJson: "Manual JSON",
  kindLabel: "Token type", kindUser: "Discord account (user token)", kindBot: "Bot (must be in the server)",

  privacy: `<b>Your token is never stored</b>: it stays in your page, is only sent to <code>discord.com</code>, and is gone when you close the tab. Nothing goes through a server of ours. The code is public: <a href="${SRC}" target="_blank" rel="noopener noreferrer">view the source code</a>.<br>Warning: a user token gives access to the whole account, never share it. Using it outside the Discord app goes against Discord's Terms of Service (your account could be sanctioned).`,

  count: "{a} / {b} selected", pickOne: "Select at least one item.",
  progress: "Downloading {i} / {n}…", zipping: "Building the ZIP…", dlFail: "Could not fetch \"{name}\".", dlDone: "{n} file(s) downloaded in the ZIP.",

  e404: "Server not found. Check that your account or bot is in this server.",

let L = (navigator.language || "en").toLowerCase().startsWith("fr") ? "fr" : "en";
let guildName = "server", roles = [], lastGuild = null;
const t = (k, v = {}) => (T[L][k] || k).replace(/\{(\w+)\}/g, (_, x) => v[x]);
function say(msg, cls = "") { const s = $("status"); s.textContent = msg; s.className = cls; }

function applyLang() {
  document.documentElement.lang = L;
  document.title = t("title");
  document.querySelectorAll("[data-i]").forEach(e => e.innerHTML = t(e.dataset.i));
  document.querySelectorAll("[data-p]").forEach(e => e.placeholder = t(e.dataset.p));
  $("lang").textContent = L === "fr" ? "EN" : "FR";
  if (lastGuild) build(); else say("");
}
$("lang").onclick = () => { L = L === "fr" ? "en" : "fr"; applyLang(); };

function setMode(bot) {
  $("modeBot").classList.toggle("hidden", !bot);
  $("modeManual").classList.toggle("hidden", bot);
  $("tabBot").className = bot ? "on" : "ghost";
  $("tabManual").className = bot ? "ghost" : "on";
}
$("tabBot").onclick = () => setMode(true);
$("tabManual").onclick = () => setMode(false);

async function api(path) {
  const tk = $("token").value.trim().replace(/^"|"$/g, "").replace(/^Bot\s+/i, "");
  const auth = $("kind").value === "bot" ? "Bot " + tk : tk;
  let r;
  try { r = await fetch(API + path, { headers: { Authorization: auth } }); }
  catch (e) { throw new Error(t("eNet")); }
  if (!r.ok) {
    let wait = 0;
    if (r.status === 429) { try { wait = Math.ceil((await r.json()).retry_after || 0); } catch (e) {} }
    throw new Error(r.status === 401 ? t("e401") : r.status === 403 ? t("e403") : r.status === 404 ? t("e404") : r.status === 429 ? t("e429", { s: wait || 5 }) : r.status >= 500 ? t("e5xx", { s: r.status }) : t("eOther", { s: r.status }));
  }
  return r.json();
}

function pick(id) {
  $("guild").value = id;
  document.querySelectorAll("#guildList .g").forEach(b => {
    const on = b.dataset.id === id;
    b.classList.toggle("sel", on);
    b.setAttribute("aria-selected", on);
  });
}

$("loadGuilds").onclick = async () => {
  if (!$("token").value.trim()) return say(t("needToken"), "err");
  say(t("loadingGuilds"));
  try {
    const guilds = await api("/users/@me/guilds");
    if (!guilds.length) return say(t("noGuilds"), "err");
    const list = $("guildList");
    list.innerHTML = "";
    guilds.forEach((g, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "g"; b.dataset.id = g.id; b.setAttribute("role", "option");
      let ic;
      if (g.icon) {
        ic = document.createElement("img");
        ic.src = `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=64`;
        ic.alt = ""; ic.loading = "lazy";
      } else {
        ic = document.createElement("span");
        ic.className = "ph";
        ic.textContent = g.name.split(/\s+/).map(w => w[0] || "").join("").slice(0, 3);
      }
      const nm = document.createElement("span");
      nm.className = "nm"; nm.textContent = g.name;
      b.append(ic, nm);
      b.onclick = () => pick(g.id);
      list.append(b);
      if (i === 0) pick(g.id);
    });
    $("guildBox").classList.remove("hidden");
    say(t("guildsFound", { n: guilds.length }), "ok");
  } catch (e) { say(e.message, "err"); }
};

$("loadRoles").onclick = async () => {
  say(t("loadingRoles"));
  try { show(await api("/guilds/" + $("guild").value)); }
  catch (e) { say(e.message, "err"); }
};

$("parse").onclick = () => {
  let g;
  try { g = JSON.parse($("json").value); } catch (e) { return say(t("badJson"), "err"); }
  if (g && g.message && !g.roles && !g.emojis) return say(t("jsonErr", { m: g.message }), "err");
  show(g);
};

function show(guild) { lastGuild = guild; $("search").value = ""; build(); }
$("type").onchange = () => { $("search").value = ""; if (lastGuild) build(); };

function build() {
  const guild = lastGuild, type = $("type").value, emojis = type === "emojis", stickers = type === "stickers";
  guildName = guild.name || "server";
  let unicode = [], lottie = 0;
  if (type === "server") {
    const mk = (folder, hash, label) => { if (!hash) return null; const ext = hash.startsWith("a_") ? "gif" : "png"; return { id: label, name: label, sel: true, ext, url: z => `https://cdn.discordapp.com/${folder}/${guild.id}/${hash}.${ext}?size=${z}` }; };
    roles = [mk("icons", guild.icon, "icon"), mk("banners", guild.banner, "banner"), mk("splashes", guild.splash, "invite-splash")].filter(Boolean);
  } else if (stickers) {
    if (!Array.isArray(guild.stickers)) return say(t("noStickerField"), "err");
    const ok = guild.stickers.filter(x => x.format_type !== 3);
    lottie = guild.stickers.length - ok.length;
    roles = ok.map(x => { const ext = x.format_type === 4 ? "gif" : "png"; return { id: x.id, name: x.name, sel: true, ext, url: z => `https://cdn.discordapp.com/stickers/${x.id}.${ext}?size=${z}` }; });
  } else if (emojis) {
    if (!Array.isArray(guild.emojis)) return say(t("noEmojiField"), "err");
    roles = guild.emojis.map(e => {
      const ext = e.animated ? "gif" : "png";
      return { id: e.id, name: e.name, sel: true, ext, url: s => `https://cdn.discordapp.com/emojis/${e.id}.${ext}?size=${s}` };
    });
  } else {
    if (!Array.isArray(guild.roles)) return say(t("noRolesField"), "err");
    roles = guild.roles.filter(r => r.icon).map(r => ({ id: r.id, name: r.name, sel: true, ext: "png", url: s => `https://cdn.discordapp.com/role-icons/${r.id}/${r.icon}.png?size=${s}` }));
    unicode = guild.roles.filter(r => !r.icon && r.unicode_emoji);
  }
  $("emojiNote").textContent = unicode.length ? t("uniNote", { n: unicode.length, list: unicode.map(r => r.unicode_emoji + " " + r.name).join(", ") }) : (lottie ? t("lottie", { n: lottie }) : "");
  if (!roles.length) {
    $("result").classList.add("hidden");
    return say(type === "server" ? t("noServer") : stickers ? t("noStickers") : emojis ? t("noEmojis") : t("noRoleIcons"), "err");
  }
  say(t(type === "server" ? "foundServer" : stickers ? "foundStickers" : emojis ? "foundEmojis" : "foundRoles", { n: roles.length, g: guildName }), "ok");
  render();
  $("result").classList.remove("hidden");
}

function render() {
  const grid = $("grid");
  grid.innerHTML = "";
  const q = $("search").value.trim().toLowerCase();
  roles.forEach(r => {
    if (q && !r.name.toLowerCase().includes(q)) return;
    const el = document.createElement("label");
    el.className = "role" + (r.sel ? " sel" : "");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = r.sel;
    cb.onchange = () => { r.sel = cb.checked; el.classList.toggle("sel", r.sel); count(); };
    const img = document.createElement("img");
    img.src = r.url(128); img.alt = ""; img.loading = "lazy";
    const name = document.createElement("span");
    name.textContent = r.name;
    const acts = document.createElement("div");
    acts.className = "acts";
    const one = document.createElement("button");
    one.type = "button"; one.className = "ghost"; one.textContent = "⬇"; one.title = t("dlOne");
    one.onclick = e => { e.preventDefault(); e.stopPropagation(); downloadOne(r); };
    const link = document.createElement("button");
    link.type = "button"; link.className = "ghost"; link.textContent = "🔗"; link.title = t("copyLink");
    link.onclick = async e => {
      e.preventDefault(); e.stopPropagation();
      const u = r.url($("size").value);
      try { await navigator.clipboard.writeText(u); say(t("linkCopied"), "ok"); } catch (err) { say(u); }
    };
    acts.append(one, link);
    el.append(cb, img, name, acts);
    grid.append(el);
  });
  count();
}
function count() { $("count").textContent = t("count", { a: roles.filter(r => r.sel).length, b: roles.length }); }
const vis = r => { const q = $("search").value.trim().toLowerCase(); return !q || r.name.toLowerCase().includes(q); };
$("all").onclick = () => { roles.filter(vis).forEach(r => r.sel = true); render(); };
$("none").onclick = () => { roles.filter(vis).forEach(r => r.sel = false); render(); };
$("search").oninput = render;

$("copySnippet").onclick = async () => {
  const b = $("copySnippet");
  try { await navigator.clipboard.writeText($("snippet").textContent); b.textContent = t("copied"); }
  catch (e) { b.textContent = t("copyFail"); }
  setTimeout(() => b.textContent = t("copy"), 2000);
};

const clean = s => s.replace(/[\\/:*?"<>|]+/g, "_").trim() || "file";

$("dl").onclick = async () => {
  const picked = roles.filter(r => r.sel);
  if (!picked.length) return say(t("pickOne"), "err");
  $("dl").disabled = true;
  try {
    const zip = new JSZip(), used = {}, size = $("size").value;
    let done = 0, next = 0;
    $("prog").classList.remove("hidden"); $("fill").style.width = "0";
    say(t("progress", { i: 0, n: picked.length }));
    const worker = async () => {
      while (next < picked.length) {
        const r = picked[next++];
        let res;
        try { res = await fetch(r.url(size)); } catch (e) { throw new Error(t("dlFail", { name: r.name })); }
        if (!res.ok) throw new Error(t("dlFail", { name: r.name }));
        let base = fileBase(r);
        used[base] = (used[base] || 0) + 1;
        if (used[base] > 1) base += "_" + r.id;
        zip.file(base + "." + r.ext, await res.blob());
        done++;
        $("fill").style.width = (done / picked.length * 100) + "%";
        say(t("progress", { i: done, n: picked.length }));
      }
    };
    await Promise.all(Array.from({ length: Math.min(6, picked.length) }, worker));
    say(t("zipping"));
    const blob = await zip.generateAsync({ type: "blob" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = clean(guildName) + "-" + ({ emojis: "emojis", stickers: "stickers", server: "server-images" }[$("type").value] || "role-icons") + ".zip";
    a.click();
    URL.revokeObjectURL(a.href);
    say(t("dlDone", { n: picked.length }), "ok");
  } catch (e) { say(e.message, "err"); }
  $("dl").disabled = false;
};

function fileBase(r) {
  const n = $("naming").value;
  return n === "id" ? r.id : n === "both" ? clean(r.name) + "_" + r.id : clean(r.name);
}
async function downloadOne(r) {
  try {
    const res = await fetch(r.url($("size").value));
    if (!res.ok) throw new Error();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await res.blob());
    a.download = fileBase(r) + "." + r.ext;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (e) { say(t("dlFail", { name: r.name }), "err"); }
}

applyLang();
</script>
</body>
</html>
